name = "agent-demo"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://ackeskin.github.io"
GITHUB_OWNER = "AcKeskin"
MODEL = "claude-haiku-5-5"
# Only these repos are visible to the agent.
ALLOWED_REPOS = "procedural-planets,canvas-deck,contexture,LastFighter,rag-demo,agent-demo"

# 5 questions per minute per IP. Each question can make up to 5 model calls.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# 20 questions per minute across all visitors.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
